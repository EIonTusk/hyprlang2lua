# Edge cases: escaped commas in exec, line continuation, devices, source.

device:epic-mouse-v1 {
    sensitivity = -0.5
    accel_profile = flat
}

# Escaped comma inside an exec arg.
bind = SUPER, R, exec, sh -c 'echo a\,b'

# Unescaped commas in an exec arg: Hyprland's CVarList(value, 4) stops
# splitting at the dispatcher, so the command keeps its commas AND its
# original spacing.
bind = SUPER, X, exec, sh -c "echo a,b,c"
bindd = SUPER, Y, Notify, exec, notify-send "one,two" "three, four"

# Line continuation in a value.
bind = SUPER, T, exec, sh -c \
    'echo continued'

source = ~/.config/hypr/colors.conf
source = ./mocha.conf

# Top-level flattened syntax.
general:gaps_in = 7

# Gesture.
gesture = 3, horizontal, workspace

# Permissions.
permission = /usr/(bin|local/bin)/grim, screencopy, allow

# env values are split on the FIRST comma only — the rest is the value.
env = XCURSOR_THEME,Bibata-Modern-Ice
env = LIST_VAR,a,b,c
envd = PATH_LIKE,/opt/one,/opt/two

# …but a value with no comma at all has no name/value pair to emit.
env = NO_COMMA

# hyprlang variable names run to the '=': '-' is legal, and a reference
# resolves to the longest declared name (hyprlang's own lookup order).
$looking-glass = looking-glass-client
$gnome-schema = org.gnome.desktop.interface
$theme-cmd = gsettings set $gnome-schema gtk-theme Adwaita
$main-mod = SUPER
bind = $main-mod, W, exec, $looking-glass --home $HOME
exec-once = $theme-cmd
# Names that spell the same Lua local, or a Lua keyword, stay distinct.
$dup_name = one
$dup-name = two
$end = three
exec-once = echo $dup_name $dup-name $end
