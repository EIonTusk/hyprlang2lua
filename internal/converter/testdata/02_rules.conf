# Window rules, workspace rules, layer rules.

windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = workspace 2 silent, class:^(firefox)$
windowrulev2 = opacity 0.95, class:^(Code)$
windowrule = float, mpv
# Hyprland >= 0.48: 'windowrule' takes the v2 grammar.
windowrule = size 800 600, class:^(big)$, title:^(x)$
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
windowrule = float, xdgTag:^(portal)$, initialClass:^(big)$

workspace = 1, persistent:true, default:true
workspace = 2, monitor:DP-1
workspace = special:magic, gapsout:30

layerrule = noanim, waybar
layerrule = blur, gtk-layer-shell
layerrule = ignorealpha 0.5, rofi
