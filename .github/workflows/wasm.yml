name: wasm

# Keeps web/main.wasm (and web/wasm_exec.js) in the repo in lockstep with the
# Go sources that produce them. Whenever the converter, the wasm shim, or the
# module graph changes on main, this workflow rebuilds the artifact and pushes
# it back if it differs from the committed copy. Use workflow_dispatch for a
# one-off rebuild (e.g. after a Go toolchain bump on the runners).
#
# The pages.yml workflow builds main.wasm fresh from source for the deployed
# site, so the deployed app is never load-bearing on the committed binary —
# this workflow exists only so that local serving of web/ (without Go) works
# off recent source.

on:
  push:
    branches: [main]
    paths:
      - 'internal/converter/**'
      - 'web/wasm/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/wasm.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wasm-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # We push back to the same branch; the default fetch is fine,
          # but we want the full history when we commit.
          persist-credentials: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build main.wasm
        run: |
          GOOS=js GOARCH=wasm go build \
            -trimpath -ldflags='-s -w' \
            -o web/main.wasm ./web/wasm

      - name: Refresh wasm_exec.js from the Go toolchain
        run: cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/wasm_exec.js

      - name: Show artifact sizes
        run: ls -lh web/main.wasm web/wasm_exec.js

      - name: Commit refreshed artifact if it changed
        run: |
          if git diff --quiet -- web/main.wasm web/wasm_exec.js; then
            echo "WASM artifact already up to date — nothing to commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/main.wasm web/wasm_exec.js
          git commit -m "ci: rebuild web/main.wasm [skip ci]" \
                     -m "Refreshed from $GITHUB_SHA via .github/workflows/wasm.yml"
          # If branch protection blocks the direct push, swap this step for
          # peter-evans/create-pull-request and gate on a label.
          git push
