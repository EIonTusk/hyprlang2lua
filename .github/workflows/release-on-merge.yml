name: release-on-merge

# Cuts a release whenever a commit lands on master whose subject (or body
# footer) matches the Conventional Commits spec. Bump kind is decided by the
# head commit alone:
#
#   <type>(scope)!: ... or BREAKING CHANGE: footer → major
#   feat(scope): ...                               → minor
#   fix(scope): ...                                → patch
#   anything else (chore/docs/refactor/ci/test/…)  → no release (silent exit)
#
# Triggers on push (not pull_request / pull_request_target) so the workflow
# always runs with a writable GITHUB_TOKEN regardless of whether the merged
# PR originated in the repo or a fork. Workflow-driven pushes (this job's
# own packaging-bump commit, the wasm.yml rebuild commit) use GITHUB_TOKEN,
# which GitHub Actions documents as NOT re-triggering workflow runs — so
# there is no infinite-loop guard needed.
#
# Setup (one-time):
#   1. Use squash-merge for PRs and write PR titles as Conventional Commits
#      (the PR title becomes the master commit subject). Or use a merge
#      commit whose subject follows the same convention.
#   2. Add `AUR_SSH_KEY` to repo secrets — the private half of an SSH key
#      whose public half is registered at https://aur.archlinux.org/account.
#   3. If master is branch-protected, allow `github-actions[bot]` to bypass
#      (same setting wasm.yml already relies on).
#
# What it does, in order:
#   - Reads the head commit subject and maps the conventional-commit type
#     to a semver bump.
#   - Bumps flake.nix's `version`, then verifies the Nix build; if vendorHash
#     is stale, rewrites it from the hash-mismatch error and re-verifies.
#   - Commits that bump to master with [skip ci]  <-- BEFORE tagging.
#   - Tags THAT commit with the next version.
#   - Waits for GitHub to materialize archive/<tag>.tar.gz.
#   - Bumps packaging/aur/PKGBUILD (pkgver, pkgrel=1, sha256sums) and
#     regenerates packaging/aur/.SRCINFO via `makepkg --printsrcinfo` inside
#     an archlinux container (matches MAINTAINING.md step 3).
#   - Commits the AUR packaging bump to master with [skip ci].
#   - Creates a GitHub Release with auto-generated notes.
#   - Pushes the PKGBUILD + .SRCINFO to the AUR git remote.
#
# Why the version bump straddles the tag (two commits, not one):
#
#   flake.nix's `version` is a plain label with no dependency on the release
#   artifact, so it must be committed BEFORE the tag — otherwise the tag
#   contains the previous version and `nix run github:owner/repo/vX.Y.Z`
#   builds a derivation labelled with the *preceding* release. That was the
#   behaviour up to v0.7.0.
#
#   PKGBUILD's `sha256sums` cannot move before the tag: it is the checksum of
#   `archive/v$pkgver.tar.gz`, i.e. of the tagged tree itself, so a PKGBUILD
#   inside that tree can never carry its own archive's hash. MAINTAINING.md
#   step 2 records the same constraint ("requires the tag to already exist").
#   The in-tree PKGBUILD therefore always describes the release that was just
#   cut and lands one commit after it. This is harmless: the AUR consumes the
#   copy pushed to the AUR git remote below, never the one inside the tag.
#
#   Bumping the flake before the tag also means a broken Nix build aborts the
#   run with no tag pushed, instead of leaving an orphan tag with no release.
#
# Manual cut: trigger via the Actions tab (workflow_dispatch) — pick patch /
# minor / major. Useful for retries or out-of-band releases.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Release bump (patch | minor | major)'
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release-on-merge
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Decide bump
        id: bump
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          MANUAL_BUMP:   ${{ inputs.bump }}
          COMMIT_MSG:    ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "$GH_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "kind=$MANUAL_BUMP" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          subject=$(printf '%s\n' "$COMMIT_MSG" | head -n1)
          # Regexes go into variables: bash's [[ =~ ]] tokenizer rejects
          # unquoted parens in an inline regex ("syntax error near token
          # )"), and quoting the regex would make it a literal string. The
          # variable-then-unquoted-deref form is the documented escape.
          re_breaking='^[a-z]+(\([^)]+\))?!:'
          re_feat='^feat(\([^)]+\))?:'
          re_fix='^fix(\([^)]+\))?:'
          # Precedence: explicit '!' breaking marker > 'BREAKING CHANGE:'
          # footer > feat > fix. Anything else is no-release.
          kind=none
          if   [[ "$subject" =~ $re_breaking ]]; then
            kind=major
          elif printf '%s\n' "$COMMIT_MSG" | grep -qE '^BREAKING CHANGE:'; then
            kind=major
          elif [[ "$subject" =~ $re_feat ]]; then
            kind=minor
          elif [[ "$subject" =~ $re_fix ]]; then
            kind=patch
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Head commit subject: '$subject' → bump kind: $kind"

      - name: Compute next version
        if: steps.bump.outputs.kind != 'none'
        id: ver
        run: |
          set -euo pipefail
          cur=$(git tag --sort=-v:refname | head -n1)
          [ -n "$cur" ] || cur=v0.0.0
          IFS=. read -r maj min pat <<< "${cur#v}"
          case "${{ steps.bump.outputs.kind }}" in
            major) maj=$((maj+1)); min=0; pat=0 ;;
            minor) min=$((min+1)); pat=0 ;;
            patch) pat=$((pat+1)) ;;
          esac
          TAG="v${maj}.${min}.${pat}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to overwrite." >&2
            exit 1
          fi
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "ver=${maj}.${min}.${pat}" >> "$GITHUB_OUTPUT"
          echo "Next version: $TAG"

      - name: Install Nix
        if: steps.bump.outputs.kind != 'none'
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Bump flake.nix version
        if: steps.bump.outputs.kind != 'none'
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -euo pipefail
          sed -i -E "s/^( *)version = \"[^\"]*\";/\1version = \"$VER\";/" flake.nix
          echo "--- flake.nix diff ---"
          git diff -- flake.nix

      - name: Verify Nix build (auto-fix vendorHash if go.sum changed)
        if: steps.bump.outputs.kind != 'none'
        run: |
          set -euo pipefail
          if nix build .#default --no-link 2> /tmp/nix.log; then
            echo "Nix build OK, vendorHash unchanged."
            exit 0
          fi
          if ! grep -q 'hash mismatch' /tmp/nix.log; then
            echo "Nix build failed for a non-hash reason:" >&2
            cat /tmp/nix.log >&2
            exit 1
          fi
          NEWHASH=$(grep -E '^\s*got:\s+sha256-' /tmp/nix.log | head -n1 | awk '{print $2}')
          if [ -z "$NEWHASH" ]; then
            echo "Could not parse new hash from nix output:" >&2
            cat /tmp/nix.log >&2
            exit 1
          fi
          echo "Updating vendorHash to $NEWHASH"
          sed -i -E "s|vendorHash = \"[^\"]*\";|vendorHash = \"$NEWHASH\";|" flake.nix
          nix build .#default --no-link

      # Must land before the tag so `nix run github:owner/repo/vX.Y.Z` reports
      # X.Y.Z rather than the preceding release. Unlike the PKGBUILD bump
      # below, nothing here depends on the tag existing.
      - name: Commit flake version bump
        if: steps.bump.outputs.kind != 'none'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flake.nix
          if git diff --cached --quiet; then
            echo "flake.nix already at $TAG — nothing to commit."
          else
            git commit -m "chore(release): $TAG [skip ci]"
            git push origin master
          fi

      # Tags whatever master HEAD now is — i.e. the flake bump above when there
      # was one, so the tagged tree self-reports the version being released.
      - name: Tag release
        if: steps.bump.outputs.kind != 'none'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          echo "Tagged $(git rev-parse --short HEAD): $(git log -1 --pretty=%s)"

      - name: Wait for archive tarball
        if: steps.bump.outputs.kind != 'none'
        env:
          URL: https://github.com/${{ github.repository }}/archive/${{ steps.ver.outputs.tag }}.tar.gz
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl -fsSL -o /tmp/release.tar.gz "$URL"; then exit 0; fi
            sleep 5
          done
          echo "Tarball never appeared at $URL" >&2
          exit 1

      - name: Bump PKGBUILD
        if: steps.bump.outputs.kind != 'none'
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -euo pipefail
          SHA=$(sha256sum /tmp/release.tar.gz | awk '{print $1}')
          sed -i -E \
            -e "s/^pkgver=.*/pkgver=$VER/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('$SHA')/" \
            packaging/aur/PKGBUILD
          echo "--- PKGBUILD diff ---"
          git diff -- packaging/aur/PKGBUILD

      - name: Regenerate .SRCINFO
        if: steps.bump.outputs.kind != 'none'
        # makepkg refuses to run as root, hence the throwaway user.
        # Mirror what MAINTAINING.md step 3 does locally.
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/packaging/aur:/work" -w /work \
            archlinux:base-devel \
            bash -c 'useradd -m b && chown -R b /work && cd /work && sudo -u b makepkg --printsrcinfo > .SRCINFO'
          echo "--- .SRCINFO diff ---"
          git diff -- packaging/aur/.SRCINFO

      # Necessarily after the tag: sha256sums is the checksum of the tagged
      # tree's own archive, so it cannot be part of that tree. See the header.
      - name: Commit AUR packaging bump
        if: steps.bump.outputs.kind != 'none'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git add packaging/aur/PKGBUILD packaging/aur/.SRCINFO
          if git diff --cached --quiet; then
            echo "Nothing to commit — AUR packaging already up to date."
            exit 0
          fi
          git commit -m "ci: bump AUR packaging to $TAG [skip ci]"
          git push origin master

      - name: Create GitHub Release
        if: steps.bump.outputs.kind != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG:      ${{ steps.ver.outputs.tag }}
        run: gh release create "$TAG" --generate-notes --title "$TAG"

      - name: Publish to AUR
        if: steps.bump.outputs.kind != 'none'
        uses: KSXGitHub/github-actions-deploy-aur@v2.7.2
        with:
          pkgname: hyprlang2lua
          pkgbuild: packaging/aur/PKGBUILD
          commit_username: EIonTusk
          commit_email: eiontusk@github.com
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: "Update to ${{ steps.ver.outputs.tag }}"
