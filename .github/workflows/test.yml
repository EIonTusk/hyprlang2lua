name: test

# workflow_dispatch is here so a commit that lands with no CI signal can be
# re-checked from the Actions tab without rewriting history. That happens more
# easily than you'd think: GitHub scans the *entire* commit message for the
# CI-skip token, body included, so merely writing about the token in a commit
# body suppresses every workflow for that commit.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go test -race
        run: go test -race ./...
      - name: fuzz (smoke, 15s)
        run: go test ./internal/converter -fuzz FuzzConvert -fuzztime 15s
      - name: build CLI
        run: go build -o /tmp/hyprlang2lua ./cmd/hyprlang2lua
