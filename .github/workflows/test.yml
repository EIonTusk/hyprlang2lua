name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go test -race
        run: go test -race ./...
      - name: fuzz (smoke, 15s)
        run: go test ./internal/converter -fuzz FuzzConvert -fuzztime 15s
      - name: build CLI
        run: go build -o /tmp/hyprlang2lua ./cmd/hyprlang2lua
